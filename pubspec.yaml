name: sirb
description: A persistent desktop Chromium browser for video and large tab collections.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  webview_cef:
    path: third_party/webview_cef
  window_manager: 0.5.2
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  sqflite_common_ffi: 2.4.3
  path_provider: 2.1.6
  path: 1.9.1
  ffi: 2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  icons_launcher: 3.1.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/icon.png
icons_launcher:
  image_path: assets/icon/icon.png
  platforms:
    linux:
      enable: true
    windows:
      enable: true
    macos:
      enable: true
